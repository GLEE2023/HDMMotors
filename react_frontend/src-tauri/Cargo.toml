[package]
name = "glee-hdm-desktop"
version = "0.1.0"
description = "GLEE HDM Motor Studio"
authors = ["GLEE"]
edition = "2021"

[lib]
name = "glee_hdm_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serialport = { version = "4.7", default-features = false }
