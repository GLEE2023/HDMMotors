[platformio]
default_envs = nanoatmega328

[env:nanoatmega328]
platform = atmelavr
board = nanoatmega328new
framework = arduino

; Unit tests run on the host only (see the native environments below).
test_ignore = *

monitor_speed = 115200

lib_deps =
    teemuatlut/TMCStepper
    arduino-libraries/Servo

; Show what you type
monitor_echo = yes
; Send a newline when Enter is pressed
monitor_eol = LF
; Let you type a complete command, then send it with Enter
monitor_filters = send_on_enter

; ----------------------------------------------------------------------
; Host unit tests (need a host gcc/g++ on PATH). The firmware is compiled
; against fake Arduino/Servo/SPI/TMCStepper headers in test/test_firmware.
;   pio test -e native              optional hardware NOT configured
;   pio test -e native_configured   optional hardware configured
; ----------------------------------------------------------------------
[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_flags =
    -DHDM_UNIT_TEST
    -Itest/test_firmware

[env:native_configured]
platform = native
test_framework = unity
test_build_src = yes
build_flags =
    -DHDM_UNIT_TEST
    -DHDM_TEST_PINS_CONFIGURED
    -Itest/test_firmware
